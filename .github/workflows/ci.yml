name: Check and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: auto-compose-vsix
          path: '*.vsix'
          retention-days: 7
